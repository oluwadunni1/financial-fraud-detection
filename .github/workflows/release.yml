# Pushing a version tag (git tag v1.0 && git push standalone v1.0) pins the
# container images to it: the three images images.yml already built and
# smoke-tested for that commit are RE-TAGGED, not rebuilt -- so :v1.0 is
# byte-for-byte the image that passed, never a fresh build that might differ.
#
# Tag only a commit images.yml has built (any commit on main after CI passed);
# otherwise the source tag is missing and this fails loudly rather than guessing.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the commit's images with the version
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in fraud-api fraud-jobs fraud-dashboard; do
            src="ghcr.io/${owner}/${image}:${GITHUB_SHA}"
            dst="ghcr.io/${owner}/${image}:${GITHUB_REF_NAME}"
            docker buildx imagetools inspect "$src" > /dev/null \
              || { echo "::error::$src does not exist -- tag a commit images.yml has built"; exit 1; }
            docker buildx imagetools create -t "$dst" "$src"
            echo "- \`$dst\` ← \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          done
