# Central configuration for the DVC pipeline.
# Every stage reads from here; nothing is hardcoded in src/.

paths:
  raw_csv: data/TabFormer/raw/card_transaction.v1.csv
  interim: data/interim
  processed: data/processed
  graph: data/graph
  models: data/models
  # Stage outputs. The manifest defines the temporal split; the split is a
  # predicate over the year-partitioned Parquet, not three copies of the data.
  # Reports live outside data/processed: that directory is the ingest stage's
  # output, and DVC rejects one stage's out nested inside another's.
  splits_manifest: reports/splits.json
  validation_report: reports/validation_report.json
  sample: data/sample/transactions.parquet
  velocity: data/features/velocity
  feature_matrix: data/features/matrix
  encoder: data/features/encoder.json
  metrics_report: reports/metrics_xgb.json
  graph_summary: reports/graph_summary.json
  embeddings: data/features/embeddings
  embeddings_summary: reports/embeddings_summary.json
  metrics_gnn: reports/metrics_gnn.json
  registry_report: reports/registry.json

ingest:
  # Row-group size for Parquet output; tuned for streaming reads during training.
  row_group_size: 1_000_000
  partition_on: Year
  # Rows per streaming batch. The 2.35 GB CSV is never materialised whole:
  # batches are read, transformed, and routed to per-year Parquet writers in a
  # single pass. Keeps peak memory flat on a 14 GB machine.
  batch_rows: 500_000
  # Validate every raw batch against RawTransactionSchema rather than sampling.
  # Costs time; buys the guarantee that all 24.4M rows were actually checked.
  validate_raw: true

sample:
  # Small stratified subset so tests and CI can run the whole DAG in seconds
  # instead of against 2.35 GB. Committed to git -- keep it small.
  n_rows: 200_000
  random_state: 42

split:
  # Temporal split. NEVER random -- transactions are time-ordered and a random
  # split leaks future information into training.
  train_end_year: 2017    # train:  Year <= 2017
  val_year: 2018          # val:    Year == 2018
  # test: Year >= 2019

validation:
  # Sanity bounds. TabFormer is ~0.1% fraud; anything far outside this range
  # means the label mapping or the file itself is wrong.
  fraud_rate_min: 0.0005
  fraud_rate_max: 0.005
  expected_row_count_min: 20_000_000

features:
  # One-hot below this cardinality, binary-encode at or above it.
  one_hot_max_cardinality: 8
  unknown_string_marker: "XX"
  unknown_zip_code: 0
  # Columns encoded as categories. Measured cardinalities: Merchant 100,343 /
  # Zip 27,322 / City 13,429 / State 223 / MCC 109 / Errors 23 / Chip 3.
  categorical: [Merchant, Zip, City, State, MCC, Errors, Chip]
  # Scaled numerics. Velocity columns are appended automatically.
  #
  # Year is deliberately NOT a feature. The split is temporal, so no training
  # row carries 2019 or 2020; a tree cannot extrapolate past its training range
  # and every test row would fall into one terminal bucket. Month and Day are
  # fine -- they recur every year.
  numeric: [Amount, Time, Month, Day]

velocity:
  # Live aggregate windows (hours). Shared by the offline feature build and the
  # online API to prevent train/serve skew.
  windows_hours: [1, 24, 168]
  # Velocity windows cross year partitions -- a 7-day window on 2018-01-02 needs
  # December 2017 -- so this cannot be computed per-partition. It is computed in
  # user chunks instead, because a window never spans two users. Smaller chunks
  # trade more passes over the Parquet for lower peak memory.
  users_per_chunk: 250

xgboost:
  n_estimators: 500
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  # Class imbalance is measured 1:819 (0.122%). Tuned on val, NOT guessed:
  # chosen by src/fraud/models/sweep.py, see reports/sweep_scale_pos_weight.json.
  #   spw    1 -> val AUC-PR 0.3175
  #   spw   10 -> val AUC-PR 0.3215  <- selected
  #   spw   50 -> val AUC-PR 0.2714  (the previous guess)
  #   spw  200 -> val AUC-PR 0.1789
  #   spw  819 -> val AUC-PR 0.1169  (full inverse prevalence -- worst on the grid)
  # Note how badly the "balanced" value does: reweighting all the way to 1:1 is
  # the standard trap with this much imbalance.
  scale_pos_weight: 10
  # Candidates for the sweep. 1 = no reweighting, 819 = full inverse prevalence.
  # The right answer is rarely either extreme, which is why it is swept.
  scale_pos_weight_grid: [1, 10, 50, 200, 819]
  # The sweep trains once per grid point, so it runs on a stratified subsample
  # of train with a shorter budget. Picking a hyperparameter does not need the
  # full 20.6M rows; the final model is then refit on all of them.
  sweep_sample_fraction: 0.15
  sweep_n_estimators: 150
  eval_metric: aucpr
  early_stopping_rounds: 50
  random_state: 42

gnn:
  # Under-sampling, straight from the blueprint (preprocess_TabFormer_np.py):
  # keep EVERY fraud row, thin non-fraud until fraud is `fraud_ratio`. This is
  # what makes the training graph tractable -- 24.4M transaction nodes become a
  # few hundred thousand -- while still showing the GNN every fraud XGBoost saw.
  #
  # Applied to the TRAINING graph ONLY. NVIDIA under-samples before splitting,
  # which leaves val and test at ~10% fraud instead of 0.122% and makes every
  # metric incomparable to the champion. Train like NVIDIA, evaluate for real.
  under_sample: true
  fraud_ratio: 0.1
  # NVIDIA also drops duplicate non-fraud rows on the nominal predictors before
  # under-sampling. We MEASURED what that costs when you evaluate on the real
  # distribution, training the same XGBoost on two 277k sets differing only in
  # this flag:
  #
  #   deduped + under-sampled   val 0.0894   test2019 0.0089
  #   under-sampled only        val 0.3541   test2019 0.1715   <- 19x better
  #   champion (20.6M rows)     val 0.5181   test2019 0.3190
  #
  # The dedupe removes repeated legitimate behaviour -- the same card at the
  # same merchant, over and over -- which is most of real traffic, so the model
  # never learns what normal looks like. It is harmless for NVIDIA because they
  # also evaluate on the deduped distribution. It is ruinous for us.
  dedupe_non_fraud: false
  hidden_channels: 128
  embedding_dim: 64
  num_layers: 2
  # NeighborLoader fanout per layer -- keeps the sampled subgraph small enough
  # that the 9.6GB feature matrix never needs to land on the GPU.
  num_neighbors: [25, 10]
  batch_size: 4096
  learning_rate: 0.001
  epochs: 20
  dropout: 0.3
  random_state: 42

serving:
  # Which registry alias the API loads (decision 14: alias, never a path).
  # `challenger` until the causal replay confirms the GNN's offline number and
  # it is promoted; then this becomes `champion`.
  model_alias: challenger
  # How many of a card's / merchant's recent rows form the request subgraph.
  # The offline fanout is [25, 10]; this is the online equivalent of the second
  # hop, and it bounds both the SQL and the forward pass.
  neighbours: 10
  # Rows older than the largest velocity window cannot affect any feature, so
  # there is nothing to gain by fetching them.
  history_hours: 168

evaluate:
  # Operating point for the fraud decision threshold.
  target_false_positive_rate: 0.01
  precision_at_k: [100, 1000]

mlflow:
  experiment_name: fraud-detection
  registered_model_name: fraud-champion
