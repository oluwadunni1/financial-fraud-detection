# Central configuration for the DVC pipeline.
# Every stage reads from here; nothing is hardcoded in src/.

paths:
  raw_csv: data/TabFormer/raw/card_transaction.v1.csv
  interim: data/interim
  processed: data/processed
  graph: data/graph
  models: data/models
  # Stage outputs. The manifest defines the temporal split; the split is a
  # predicate over the year-partitioned Parquet, not three copies of the data.
  # Reports live outside data/processed: that directory is the ingest stage's
  # output, and DVC rejects one stage's out nested inside another's.
  splits_manifest: reports/splits.json
  validation_report: reports/validation_report.json
  sample: data/sample/transactions.parquet
  velocity: data/features/velocity
  feature_matrix: data/features/matrix
  encoder: data/features/encoder.json
  metrics_report: reports/metrics_xgb.json
  graph_summary: reports/graph_summary.json
  embeddings: data/features/embeddings
  embeddings_summary: reports/embeddings_summary.json
  metrics_gnn: reports/metrics_gnn.json
  fm_sequences: data/features/fm_sequences
  fm_sequences_summary: reports/fm_sequences.json
  fm_embeddings: data/features/fm_embeddings
  fm_embeddings_summary: reports/fm_embeddings.json
  fm_embeddings_isolated: data/features/fm_embeddings_isolated
  fm_embeddings_isolated_summary: reports/fm_embeddings_isolated.json
  fm_checkpoint: data/models/fm
  fm_metrics: reports/metrics_fm.json
  fm_head: data/models/fm_head
  registry_report: reports/registry.json

# --- foundation model (Phase 3.5) ----------------------------------------
# Upstream: github.com/oluwadunni1/transaction-foundation-model
fm:
  # 2016+ matches the GNN subsample (decision 11) so the three models are
  # compared on the same footing.
  min_year: 2016
  # config.json allows 8192 positions, but pretraining ran at 4096
  # (configs/pretrain_financial_decoder.yaml). Extracting at the trained
  # length keeps us out of RoPE extrapolation.
  seq_length: 4096
  batch_size: 16
  # The isolated arm (upstream's per-row extraction) feeds 14-token inputs,
  # so it batches ~300x wider than the 4096-token sequences.
  isolated_batch_size: 4096
  dtype: float16
  # Downstream head: upstream notebook 05's structure (PCA 512 -> 64, then
  # XGBoost on base / embeddings-only / combined), our evaluation. PCA is
  # fitted on a sample of TRAIN rows; 3.4M x 512 fp32 would not fit in RAM.
  head:
    pca_dim: 64
    pca_fit_rows: 500000
    device: cuda   # XGBoost on the T4; "cpu" works, just slower
  # Pulled into our own pipeline rather than depending on `git lfs` at run
  # time. GitHub serves LFS content from media.githubusercontent.com; the raw
  # host returns a 133-byte pointer that looks like a valid file.
  checkpoint:
    repo: oluwadunni1/transaction-foundation-model
    ref: main
    path: models/decoder-foundation-model

# --- fetch_raw ------------------------------------------------------------
# The raw CSV is a STAGE OUTPUT, not a standalone .dvc pointer. DVC never
# collected that pointer as a stage, so `dvc push`/`dvc pull` silently skipped
# the 2.35 GB source while handling every derived artifact. As a stage output
# it lives in the DAG and blanket operations cover it.
fetch:
  # Box serves a 278 MB transactions.tgz; fetch_raw unpacks the CSV from it.
  raw_url: "https://ibm.box.com/index.php?rm=box_download_shared_file&shared_name=mhrtz6xiknblqznoi9h4f390scoqustt&file_id=f_770766751708"
  # txn_id is this file's row index, so a different byte stream renumbers every
  # transaction. Verification failing must stop the pipeline, not warn.
  expected_size: 2354626737
  expected_md5: "5d0f027f333e8ec7d58969a7b8a206f8"

ingest:
  # Row-group size for Parquet output; tuned for streaming reads during training.
  row_group_size: 1_000_000
  partition_on: Year
  # Rows per streaming batch. The 2.35 GB CSV is never materialised whole:
  # batches are read, transformed, and routed to per-year Parquet writers in a
  # single pass. Keeps peak memory flat on a 14 GB machine.
  batch_rows: 500_000
  # Validate every raw batch against RawTransactionSchema rather than sampling.
  # Costs time; buys the guarantee that all 24.4M rows were actually checked.
  validate_raw: true

sample:
  # Small stratified subset so tests and CI can run the whole DAG in seconds
  # instead of against 2.35 GB. Committed to git -- keep it small.
  n_rows: 200_000
  random_state: 42

split:
  # Temporal split. NEVER random -- transactions are time-ordered and a random
  # split leaks future information into training.
  train_end_year: 2017    # train:  Year <= 2017
  val_year: 2018          # val:    Year == 2018
  # test: Year >= 2019

validation:
  # Sanity bounds. TabFormer is ~0.1% fraud; anything far outside this range
  # means the label mapping or the file itself is wrong.
  fraud_rate_min: 0.0005
  fraud_rate_max: 0.005
  expected_row_count_min: 20_000_000

features:
  # One-hot below this cardinality, binary-encode at or above it.
  one_hot_max_cardinality: 8
  unknown_string_marker: "XX"
  unknown_zip_code: 0
  # Columns encoded as categories. Measured cardinalities: Merchant 100,343 /
  # Zip 27,322 / City 13,429 / State 223 / MCC 109 / Errors 23 / Chip 3.
  categorical: [Merchant, Zip, City, State, MCC, Errors, Chip]
  # Scaled numerics. Velocity columns are appended automatically.
  #
  # Year is deliberately NOT a feature. The split is temporal, so no training
  # row carries 2019 or 2020; a tree cannot extrapolate past its training range
  # and every test row would fall into one terminal bucket. Month and Day are
  # fine -- they recur every year.
  numeric: [Amount, Time, Month, Day]

velocity:
  # Live aggregate windows (hours). Shared by the offline feature build and the
  # online API to prevent train/serve skew.
  windows_hours: [1, 24, 168]
  # Velocity windows cross year partitions -- a 7-day window on 2018-01-02 needs
  # December 2017 -- so this cannot be computed per-partition. It is computed in
  # user chunks instead, because a window never spans two users. Smaller chunks
  # trade more passes over the Parquet for lower peak memory.
  users_per_chunk: 250

xgboost:
  n_estimators: 500
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  # Class imbalance is measured 1:819 (0.122%). Tuned on val, NOT guessed:
  # chosen by src/fraud/models/sweep.py, see reports/sweep_scale_pos_weight.json.
  #   spw    1 -> val AUC-PR 0.3175
  #   spw   10 -> val AUC-PR 0.3215  <- selected
  #   spw   50 -> val AUC-PR 0.2714  (the previous guess)
  #   spw  200 -> val AUC-PR 0.1789
  #   spw  819 -> val AUC-PR 0.1169  (full inverse prevalence -- worst on the grid)
  # Note how badly the "balanced" value does: reweighting all the way to 1:1 is
  # the standard trap with this much imbalance.
  scale_pos_weight: 10
  # Candidates for the sweep. 1 = no reweighting, 819 = full inverse prevalence.
  # The right answer is rarely either extreme, which is why it is swept.
  scale_pos_weight_grid: [1, 10, 50, 200, 819]
  # The sweep trains once per grid point, so it runs on a stratified subsample
  # of train with a shorter budget. Picking a hyperparameter does not need the
  # full 20.6M rows; the final model is then refit on all of them.
  sweep_sample_fraction: 0.15
  sweep_n_estimators: 150
  eval_metric: aucpr
  early_stopping_rounds: 50
  random_state: 42

gnn:
  # Under-sampling, straight from the blueprint (preprocess_TabFormer_np.py):
  # keep EVERY fraud row, thin non-fraud until fraud is `fraud_ratio`. This is
  # what makes the training graph tractable -- 24.4M transaction nodes become a
  # few hundred thousand -- while still showing the GNN every fraud XGBoost saw.
  #
  # Applied to the TRAINING graph ONLY. NVIDIA under-samples before splitting,
  # which leaves val and test at ~10% fraud instead of 0.122% and makes every
  # metric incomparable to the champion. Train like NVIDIA, evaluate for real.
  under_sample: true
  fraud_ratio: 0.1
  # NVIDIA also drops duplicate non-fraud rows on the nominal predictors before
  # under-sampling. We MEASURED what that costs when you evaluate on the real
  # distribution, training the same XGBoost on two 277k sets differing only in
  # this flag:
  #
  #   deduped + under-sampled   val 0.0894   test2019 0.0089
  #   under-sampled only        val 0.3541   test2019 0.1715   <- 19x better
  #   champion (20.6M rows)     val 0.5181   test2019 0.3190
  #
  # The dedupe removes repeated legitimate behaviour -- the same card at the
  # same merchant, over and over -- which is most of real traffic, so the model
  # never learns what normal looks like. It is harmless for NVIDIA because they
  # also evaluate on the deduped distribution. It is ruinous for us.
  dedupe_non_fraud: false
  hidden_channels: 128
  embedding_dim: 64
  num_layers: 2
  # NeighborLoader fanout per layer -- keeps the sampled subgraph small enough
  # that the 9.6GB feature matrix never needs to land on the GPU.
  num_neighbors: [25, 10]
  batch_size: 4096
  learning_rate: 0.001
  epochs: 20
  dropout: 0.3
  random_state: 42

serving:
  # Which registry alias the API loads (decision 14: alias, never a path).
  # `challenger` until the causal replay confirms the GNN's offline number and
  # it is promoted; then this becomes `champion`.
  model_alias: challenger
  # How many of a card's / merchant's recent rows form the request subgraph.
  # The offline fanout is [25, 10]; this is the online equivalent of the second
  # hop, and it bounds both the SQL and the forward pass.
  neighbours: 10
  # Rows older than the largest velocity window cannot affect any feature, so
  # there is nothing to gain by fetching them.
  history_hours: 168
  # Decision 20: on ~21-node graphs torch's intra-op threads cost more than
  # they save (threads=4 measured 10 rows/s against 178 at threads=1). The
  # sharded replay applied this; the API did not, until the latency replay.
  torch_threads: 1
  # Database round trips per request. false: BEGIN + 2 reads, log, insert,
  # commit = 6. true: one combined read and one combined write in autocommit
  # = 2. Same rows, same order, same scores -- the latency replay checks it.
  merged_round_trips: true
  # The latency replay (`replay.py --http`): a contiguous slice sent through the
  # running API one request at a time, against a seeded Supabase store.
  latency:
    start: "2019-06-03"
    n: 3000
    port: 8765
    rtt_probes: 50        # `select 1` round trips timed for the network baseline
    explain_samples: 20   # history reads re-run under EXPLAIN ANALYZE
    # Round-trip times a deploy beside the database would see: same AZ, and
    # across AZs in one region. The projection swaps these in for the measured RTT.
    target_rtt_ms: [0.5, 2.0]

evaluate:
  # Operating point for the fraud decision threshold.
  target_false_positive_rate: 0.01
  precision_at_k: [100, 1000]

mlflow:
  experiment_name: fraud-detection
  registered_model_name: fraud-champion

# --- monitoring (Phase 5) -------------------------------------------------
# Runs in .venv-monitoring (NannyML conflicts with .venv; see pyproject.toml).
# Question: can a degrading model be seen BEFORE its chargebacks arrive?
monitoring:
  reference_year: 2018      # labelled period CBPE calibrates on (= val)
  # 2019 only: the analysis scores were written for 2019, and TabFormer has no
  # fraud at all after October 2019 (Nov 2019 - Feb 2020 carry zero positives).
  analysis_years: [2019]
  chunk_period: M           # one chunk per calendar month
  # Scores already written by earlier stages, per model: (reference, analysis).
  scores:
    xgboost:
      reference: reports/scores_xgb_2018.npz
      analysis: reports/scores_xgb_2019.npz
    graphsage:
      reference: reports/metrics_replay_2018.npz
      analysis: reports/metrics_replay.npz
  # Simulated chargebacks. A fraud label surfaces after a lognormal delay
  # (median ~45 days, real chargebacks run 30-90+); a legitimate transaction
  # counts as confirmed once `confirm_after_days` pass with no chargeback.
  labels:
    fraud_delay_median_days: 45
    fraud_delay_sigma: 0.5
    fraud_delay_min_days: 7
    fraud_delay_max_days: 120
    confirm_after_days: 90
    seed: 42
  # A month's label-based metric is trusted once this share of its rows is
  # labelled; before that it is computed on a biased subset (frauds surface
  # first, legitimate rows only when their dispute window closes).
  min_label_coverage: 0.99
  # The operating point for CBPE's threshold metrics: the score at this FPR on
  # the reference period, frozen -- the same rule evaluate.py applies.
  target_false_positive_rate: 0.01
  # Raw inputs watched for drift, plus the model score itself.
  drift:
    continuous: [Amount, Time, velocity_count_24h, velocity_amount_24h,
                 velocity_count_168h, velocity_seconds_since_last]
    categorical: [Chip, MCC, State, Errors]
  # A metric is flagged when it leaves the reference band by this many
  # standard deviations of the reference chunks (NannyML's default rule).
  alert_std: 3
  # NannyML's band is +/- alert_std sigma of the REFERENCE CHUNKS. With ~200
  # frauds a month, single-month AUC-PR is so noisy that the band is useless
  # (XGBoost's lower threshold is 0). So degradation is also flagged against
  # the reference level directly: estimate below (1 - tolerance) x reference.
  degradation_tolerance: 0.15
  # An alert needs this many CONSECUTIVE flagged months (decision 25): monthly
  # AUC-PR swings by ±0.1 on noise, so one month alone pages on noise.
  persistence_months: 2
  # Freshness SLIs (fraud.monitoring.run). hot_store_max_hours comes from the
  # staleness experiment (notebook 03): no lag up to 24 h made GraphSAGE worse;
  # 72 h cost -0.10 AUC-PR [-0.14, -0.06]. 24 h is the largest lag measured safe.
  freshness:
    hot_store_max_hours: 24
    labels_max_hours: 72
  output_dir: reports/monitoring

# --- explainability (Phase 5) ---------------------------------------------
explain:
  top_k_reasons: 5
  n_alerts: 20              # top-scored 2019 transactions explained per model
  global_sample: 20000      # rows for the XGBoost beeswarm
  # GraphSAGE group Shapley: the five "players". Absent = the path the model
  # already handles for a missing input (see fraud.explain.graph).
  graph_groups: [transaction, velocity, card_history, merchant_history, identity]

# --- staleness experiment (Phase 5, ARCHITECTURE 6.2) ---------------------------
# GraphSAGE reads live history, so the staleness that matters is how far the hot
# store's INGEST runs behind: a row visible only once it is `lag` old. Replayed
# on a 2019 slice per lag; lag 0 must reproduce reports/metrics_replay.npz.
staleness:
  start: "2019-04-01"
  end: "2019-07-01"           # exclusive; Apr-Jun 2019, ~430k rows
  lags_hours: [0, 1, 6, 24, 72, 168]
  shards: 4
  bootstrap: 300              # paired resamples for the AUC-PR difference vs lag 0
  output_dir: reports/staleness
