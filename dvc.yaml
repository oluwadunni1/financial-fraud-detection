# The pipeline. If it is not a stage here, it is not the pipeline.
#
# Run: .venv/bin/dvc repro
# The split is a manifest over year-partitioned Parquet, not three copies of
# the data -- see reports/splits.json and src/fraud/data/split.py.

stages:
  ingest:
    desc: Raw TabFormer CSV -> year-partitioned Parquet, one streaming pass.
    cmd: .venv/bin/python -m fraud.data.ingest
    deps:
      - data/TabFormer/raw/card_transaction.v1.csv
      - src/fraud/config.py
      - src/fraud/data/ingest.py
      - src/fraud/data/schemas.py
    params:
      - paths.raw_csv
      - paths.processed
      - ingest
    outs:
      - data/processed

  validate:
    desc: Schema + dataset gates. A corrupted row must fail the build here.
    cmd: .venv/bin/python -m fraud.data.validate
    deps:
      - data/processed
      - src/fraud/config.py
      - src/fraud/data/schemas.py
      - src/fraud/data/validate.py
    params:
      - paths.processed
      - paths.validation_report
      - validation
    outs:
      # cache: false -- small JSON, more useful diffable in git than in the
      # DVC cache, and CI can read it without a remote to pull from.
      - reports/validation_report.json:
          cache: false

  split:
    desc: Temporal split manifest, with the no-leakage assertions.
    cmd: .venv/bin/python -m fraud.data.split
    deps:
      - data/processed
      - src/fraud/config.py
      - src/fraud/data/split.py
    params:
      - paths.processed
      - paths.splits_manifest
      - split
    outs:
      - reports/splits.json:
          cache: false

  sample:
    desc: Small stratified subset so tests and CI can run the DAG in seconds.
    cmd: .venv/bin/python -m fraud.data.sample
    deps:
      - data/processed
      - src/fraud/config.py
      - src/fraud/data/sample.py
    params:
      - paths.processed
      - paths.sample
      - sample
    outs:
      # Committed to git: with no DVC remote, this is the only way CI gets data.
      - data/sample/transactions.parquet:
          cache: false

  velocity:
    desc: >
      Per-user aggregates over strictly-earlier transactions. Shared with the
      serving path -- see src/fraud/features/velocity.py.
    cmd: .venv/bin/python -m fraud.features.build_velocity
    deps:
      - data/processed
      - src/fraud/config.py
      - src/fraud/features/build_velocity.py
      - src/fraud/features/velocity.py
    params:
      - paths.processed
      - paths.velocity
      - velocity
    outs:
      - data/features/velocity

  features:
    desc: Encoder fitted on TRAIN ONLY, applied to every split.
    cmd: .venv/bin/python -m fraud.features.build
    deps:
      - data/features/velocity
      - data/processed
      - src/fraud/config.py
      - src/fraud/data/split.py
      - src/fraud/features/build.py
      - src/fraud/features/encoders.py
    params:
      - paths.processed
      - paths.velocity
      - paths.feature_matrix
      - paths.encoder
      - features
      - velocity.windows_hours
      - split
    outs:
      - data/features/matrix
      - data/features/encoder.json

  train_xgb:
    desc: Baseline champion. Batch-loaded so the matrix is never resident whole.
    cmd: .venv/bin/python -m fraud.models.xgb
    deps:
      - data/features/matrix
      - src/fraud/config.py
      - src/fraud/data/split.py
      - src/fraud/models/xgb.py
    params:
      - paths.feature_matrix
      - paths.models
      - xgboost
      - split
    outs:
      - data/models/xgb

  evaluate:
    desc: >
      Threshold chosen on val, applied unchanged to test. Test reported twice:
      2019-only for headline AUC-PR, 2019+2020 for operating point.
    cmd: .venv/bin/python -m fraud.models.evaluate
    deps:
      - data/features/matrix
      - data/models/xgb
      - src/fraud/config.py
      - src/fraud/models/evaluate.py
      - src/fraud/models/metrics.py
    params:
      - paths.feature_matrix
      - paths.models
      - paths.metrics_report
      - evaluate
      - split
    outs:
      - reports/metrics_xgb.json:
          cache: false

  register:
    desc: >
      Log to MLflow and set the `champion` alias. The ONLY stage needing network
      access and credentials -- CI without them should run `dvc repro evaluate`.
    cmd: .venv/bin/python -m fraud.models.registry
    deps:
      - data/features/encoder.json
      - data/models/xgb
      - reports/metrics_xgb.json
      - src/fraud/config.py
      - src/fraud/models/registry.py
    params:
      - paths.models
      - paths.encoder
      - paths.metrics_report
      - paths.registry_report
      - mlflow
    outs:
      - reports/registry.json:
          cache: false

  build_graph:
    desc: >
      Tri-partite User->Transaction->Merchant graph, ported from the NVIDIA
      blueprint. Training graph under-sampled to ~9.1% fraud as the blueprint
      does; val/test kept at the real rate so metrics stay comparable.
    cmd: .venv/bin/python -m fraud.features.graph
    deps:
      - data/features/encoder.json
      - data/features/matrix
      - data/processed
      - src/fraud/config.py
      - src/fraud/data/split.py
      - src/fraud/features/encoders.py
      - src/fraud/features/graph.py
    params:
      - paths.processed
      - paths.feature_matrix
      - paths.encoder
      - paths.graph
      - paths.graph_summary
      - gnn.under_sample
      - gnn.fraud_ratio
      - gnn.random_state
      - split
    outs:
      - data/graph
      - reports/graph_summary.json:
          cache: false

  train_gnn:
    desc: >
      Heterogeneous GraphSAGE on the tri-partite graph. Validation AUC-PR peaks
      early (~epoch 17) and degrades after, so epochs is set low deliberately.
    cmd: .venv/bin/python -m fraud.models.gnn
    deps:
      - data/graph
      - src/fraud/config.py
      - src/fraud/models/gnn.py
      - src/fraud/models/metrics.py
    params:
      - paths.graph
      - paths.models
      - gnn
    outs:
      - data/models/gnn

  gnn_embeddings:
    desc: The 64-d user and merchant embeddings Phase 4 serves from Postgres.
    cmd: .venv/bin/python -m fraud.models.gnn_embeddings
    deps:
      - data/graph
      - data/models/gnn
      - src/fraud/config.py
      - src/fraud/models/gnn_embeddings.py
    params:
      - paths.graph
      - paths.models
      - paths.embeddings
      - paths.embeddings_summary
      - gnn
    outs:
      - data/features/embeddings
      - reports/embeddings_summary.json:
          cache: false

  evaluate_gnn:
    desc: >
      The ablation that answers the project's question: identical XGBoost head,
      identical rows, with and without the GNN embeddings. The delta is the
      structural contribution with the tree-vs-net difference cancelled out.
    cmd: .venv/bin/python -m fraud.models.evaluate_gnn
    deps:
      - data/features/embeddings
      - data/features/matrix
      - data/graph
      - src/fraud/config.py
      - src/fraud/models/evaluate_gnn.py
      - src/fraud/models/metrics.py
    params:
      - paths.graph
      - paths.embeddings
      - paths.feature_matrix
      - paths.metrics_gnn
      - evaluate
      - xgboost
      - split
    outs:
      - reports/metrics_gnn.json:
          cache: false
