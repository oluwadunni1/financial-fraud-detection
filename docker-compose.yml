# The platform, locally. Two ways to get the images:
#   docker compose pull && docker compose up -d     the CI-built images from ghcr.io
#                                                   (images.yml; ~1 min, no build)
#   docker compose up -d --build                    build from the working tree (~5 min)
# Pin a commit instead of `latest` with FRAUD_IMAGE_TAG=<full git sha>.
#
#   postgres  the hot store: Postgres 17 + pgvector, schema from sql/ applied on
#             first start (the same four migrations Supabase runs)
#   api       FastAPI: @champion decides, @challenger scores in shadow; models
#             come from the DagsHub registry by alias (credentials from .env)
#   monitor   the monthly monitoring job (fraud.monitoring.run) on a loop
#   dashboard the Streamlit presentation app on :8501 (app/streamlit_app.py)
#
# By default the API serves against the LOCAL Postgres -- the co-located setup
# Phase 4 could only project. To serve against Supabase instead:
#   docker compose --profile supabase up api-supabase
#
# .env supplies MLFLOW_TRACKING_URI/USERNAME/PASSWORD and DATABASE_URL (Supabase).

name: fraud

x-local-db: &local-db
  DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"          # 5433 on the host, so it never collides with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime        # NOT the default: the file's last stage is the dashboard
    image: ghcr.io/oluwadunni1/fraud-api:${FRAUD_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      <<: *local-db
      API_WORKERS: "${API_WORKERS:-3}"    # leave a core for Postgres on a 4-core box
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.jobs
    image: ghcr.io/oluwadunni1/fraud-jobs:${FRAUD_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      <<: *local-db
      MONITOR_AS_OF: "2019-11-01"
      MONITOR_INTERVAL_SECONDS: "86400"
    volumes:                 # read-only: the job reads scores and data, writes only to the DB
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:                 # the presentation app -> http://localhost:8501
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dashboard
    image: ghcr.io/oluwadunni1/fraud-dashboard:${FRAUD_IMAGE_TAG:-latest}
    env_file: .env           # MLflow credentials, for the registry page
    environment:
      FRAUD_API: http://api:8000
      # The Compose Postgres, explicitly: .env's DATABASE_URL is Supabase, and
      # the replay page resets the store (fraud.dashboard.data refuses Supabase).
      FRAUD_DB_URL: postgresql://fraud:fraud@postgres:5432/fraud
    volumes:                 # read-only: transactions, models and committed reports
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api-supabase:
    profiles: ["supabase"]
    image: ghcr.io/oluwadunni1/fraud-api:${FRAUD_IMAGE_TAG:-latest}
    env_file: .env           # DATABASE_URL from .env: the live Supabase store
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  pgdata:
